name: Deploy to SiteGround

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Upload site files via FTPS
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}" --env-password \
            -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; cd /aquaflowplumbing.us/public_html/; put index.html; put style.css; put script.js; bye" \
            ftp.aquaflowplumbing.us
