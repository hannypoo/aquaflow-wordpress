name: Deploy to SiteGround

on:
  push:
    branches: [ main ]
    paths: [ 'index.html' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Upload index.html via FTPS
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}" --env-password \
            -e "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; put -O /aquaflowplumbing.us/public_html/ index.html; bye" \
            ftp.aquaflowplumbing.us
